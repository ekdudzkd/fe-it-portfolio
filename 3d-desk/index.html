<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #fff; color: #000; font-family: "Noto Sans KR", sans-serif; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #intro { position: fixed; top: 24px; left: 24px; pointer-events: none; }
  #intro h1 { margin: 0; font-size: 28px; }
  #intro p { margin: 4px 0 0; }
  #listLink { position: fixed; top: 24px; right: 24px; color: #000; }
  #label { position: fixed; pointer-events: none; padding: 4px 8px; background: #000; color: #fff;
           font-size: 14px; display: none; transform: translate(12px, 12px); white-space: nowrap; }

  /* 물건 표면 위에 겹치는 내용 (위치는 스크립트가 표면 모서리에 맞춤) */
  #panel { position: fixed; display: none; opacity: 0; transition: opacity .25s; }
  #panel.show { opacity: 1; }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
  #panel.app #frame { display: block; }
  #desktopIcons { position: absolute; inset: 0; display: none; }
  #panel.desktop #desktopIcons { display: block; }
  #desktopIcons button { position: absolute; width: 16%; height: 30%; transform: translate(-50%, -50%);
                         background: transparent; border: 0; cursor: pointer; }
  #desktopIcons button:hover, #desktopIcons button:focus-visible { outline: 3px solid #fff; }

  #back { position: fixed; top: 24px; left: 24px; display: none; font: inherit; padding: 6px 12px;
          background: #fff; color: #000; border: 1px solid #000; cursor: pointer; z-index: 2; }
  body.zoomed #intro, body.zoomed #listLink { display: none; }
  body.zoomed #back, body.zoomed #panel { display: block; }

  @media (max-width: 600px) {
    #intro { top: 16px; left: 16px; }
    #intro h1 { font-size: 22px; }
    #listLink { top: 16px; right: 16px; }
    #back { top: 12px; left: 12px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="intro">
  <h1>[이름]</h1>
  <p>포트폴리오</p>
  <p>책상 위 물건을 눌러 보세요</p>
</div>
<a id="listLink" href="list.html">목록으로 보기</a>
<div id="label"></div>

<div id="panel">
  <div id="desktopIcons">
    <button type="button" data-src="dongle-seoul.html" style="left:35%; top:46%" aria-label="동글서울 열기"></button>
    <button type="button" data-src="gonggu.html" style="left:65%; top:46%" aria-label="공구한 열기"></button>
  </div>
  <iframe id="frame" title="프로젝트 내용"></iframe>
</div>
<button id="back" type="button">← 책상으로</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

try {
  await Promise.all([
    document.fonts.load('700 40px "Noto Sans KR"'),
    document.fonts.load('400 40px "Noto Sans KR"'),
  ]);
} catch (e) { /* 폰트가 없어도 기본 글꼴로 그림 */ }

const FONT = '"Noto Sans KR", sans-serif';
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- 기본 장면 ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ffffff');

const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);

scene.add(new THREE.HemisphereLight('#ffffff', '#d8d8d8', 1.6));
const sun = new THREE.DirectionalLight('#ffffff', 1.6);
sun.position.set(4, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra });
function box(w, h, d, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// ---------- 책상 ----------
const DESK_Y = 0.75;
const desk = new THREE.Group();
const top = box(8, 0.12, 4.2, mat('#ececec'));
top.position.y = DESK_Y - 0.06;
desk.add(top);
for (const [x, z] of [[-3.8, -1.9], [3.8, -1.9], [-3.8, 1.9], [3.8, 1.9]]) {
  const leg = box(0.16, 3, 0.16, mat('#d6d6d6'));
  leg.position.set(x, DESK_Y - 1.62, z);
  desk.add(leg);
}
scene.add(desk);

// 누를 수 있는 물건 모음.
// surface: 확대했을 때 내용이 뜨는 면 (물건 기준 좌표의 가운데 · 너비 · 높이 · 바깥 방향 · 위쪽 방향)
const clickables = [];
function clickable(group, label, surface) {
  group.userData = { label, surface, baseY: group.position.y, lift: 0 };
  surface.obj = group;
  clickables.push(group);
  scene.add(group);
  return group;
}

// ---------- 모니터 (동글서울 · 공구한) ----------
const SCREEN_W = 3.0, SCREEN_H = 1.7;
const SCREEN_CENTER = V(0, DESK_Y + 1.6, -1.2 + 0.056);
const monitor = new THREE.Group();
{
  const dark = mat('#1d1d1d', { roughness: 0.5 });
  const base = box(1.1, 0.05, 0.6, dark);
  base.position.set(0, DESK_Y + 0.025, -1.25);
  const neck = box(0.16, 1.0, 0.1, dark);
  neck.position.set(0, DESK_Y + 0.5, -1.35);
  const body = box(3.2, 1.9, 0.1, dark);
  body.position.set(0, SCREEN_CENTER.y, -1.2);
  const screenTex = canvasTexture(1200, 680, (g, w, h) => {
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#2f5f96');
    grad.addColorStop(1, '#86b8e4');
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);
    const icons = [
      { x: 0.35, emoji: '🏙️', name: '동글서울' },
      { x: 0.65, emoji: '🛒', name: '공구한' },
    ];
    for (const ic of icons) {
      const cx = ic.x * w, cy = 0.42 * h, s = 150;
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.roundRect(cx - s / 2, cy - s / 2, s, s, 32);
      g.fill();
      g.font = `90px ${FONT}`;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(ic.emoji, cx, cy + 6);
      g.fillStyle = '#ffffff';
      g.font = `700 40px ${FONT}`;
      g.fillText(ic.name, cx, cy + s / 2 + 44);
    }
  });
  const screen = new THREE.Mesh(
    new THREE.PlaneGeometry(SCREEN_W, SCREEN_H),
    new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false })
  );
  screen.position.copy(SCREEN_CENTER);
  monitor.add(base, neck, body, screen);
}
clickable(monitor, '모니터 · 동글서울 · 공구한', {
  center: SCREEN_CENTER.clone(), w: SCREEN_W, h: SCREEN_H,
  normal: V(0, 0, 1), up: V(0, 1, 0), desktop: true,
});

// 키보드 · 마우스 (장식)
{
  const kb = box(1.9, 0.05, 0.6, mat('#d9d9d9'));
  kb.position.set(0, DESK_Y + 0.025, 0.05);
  const mouse = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 16), mat('#f4f4f4'));
  mouse.scale.set(1, 0.4, 1.5);
  mouse.position.set(1.35, DESK_Y + 0.05, 0.05);
  mouse.castShadow = true;
  scene.add(kb, mouse);
}

// 머그 (장식)
{
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.2, 0.45, 32), mat('#ffffff'));
  mug.position.set(2.7, DESK_Y + 0.225, -1.0);
  mug.castShadow = true;
  const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.19, 32), mat('#6b4a33'));
  coffee.rotation.x = -Math.PI / 2;
  coffee.position.set(2.7, DESK_Y + 0.4, -1.0);
  scene.add(mug, coffee);
}

// ---------- 휴대폰 (패밀링크) ----------
const PHONE_ROT = -0.35;
const phone = new THREE.Group();
{
  const body = box(0.5, 0.05, 0.95, mat('#1d1d1d', { roughness: 0.4 }));
  const tex = canvasTexture(300, 580, (g, w, h) => {
    g.fillStyle = '#f2f2f2';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#000';
    g.textAlign = 'center';
    g.font = `400 26px ${FONT}`;
    g.fillText('안부전화', w / 2, 120);
    g.font = `700 42px ${FONT}`;
    g.fillText('패밀링크', w / 2, 180);
    g.fillStyle = '#2fb35a';
    g.beginPath();
    g.arc(w / 2, 440, 52, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#fff';
    g.font = `60px ${FONT}`;
    g.textBaseline = 'middle';
    g.fillText('📞', w / 2, 444);
  });
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(0.44, 0.88),
    new THREE.MeshBasicMaterial({ map: tex, toneMapped: false })
  );
  face.rotation.x = -Math.PI / 2;
  face.position.y = 0.026;
  phone.add(body, face);
  phone.position.set(2.75, DESK_Y + 0.025, 0.45);
  phone.rotation.y = PHONE_ROT;
}
clickable(phone, '휴대폰 · 패밀링크', {
  center: V(0, 0.027, 0), w: 0.44, h: 0.88,
  normal: V(0, 1, 0), up: V(0, 0, -1), src: 'familink.html',
});

// ---------- 이력서 종이 (소개 · 기술 스택) ----------
const resume = new THREE.Group();
{
  const tex = canvasTexture(600, 820, (g, w, h) => {
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#000';
    g.font = `700 52px ${FONT}`;
    g.fillText('이력서', 50, 100);
    g.font = `400 30px ${FONT}`;
    g.fillText('[이름]', 50, 160);
    g.fillText('프론트엔드 개발자', 50, 205);
    g.fillStyle = '#c9c9c9';
    for (let i = 0; i < 11; i++) g.fillRect(50, 280 + i * 46, i % 3 === 2 ? 300 : 500, 12);
  });
  const paper = new THREE.Mesh(
    new THREE.PlaneGeometry(1.15, 1.57),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 })
  );
  paper.rotation.x = -Math.PI / 2;
  paper.receiveShadow = true;
  // 클릭 판정을 쉽게 하려고 얇은 상자 하나를 같이 둔다
  const hit = box(1.15, 0.01, 1.57, mat('#ffffff'));
  hit.position.y = -0.006;
  resume.add(hit, paper);
  resume.position.set(-0.2, DESK_Y + 0.012, 1.15);
  resume.rotation.y = 0.08;
}
clickable(resume, '이력서 · 소개와 기술 스택', {
  center: V(0, 0.001, 0), w: 1.15, h: 1.57,
  normal: V(0, 1, 0), up: V(0, 0, -1), src: 'list.html#about',
});

// ---------- 명함 (연락처) ----------
const card = new THREE.Group();
{
  const tex = canvasTexture(560, 320, (g, w, h) => {
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#000';
    g.font = `700 44px ${FONT}`;
    g.fillText('[이름]', 40, 90);
    g.font = `400 26px ${FONT}`;
    g.fillText('Email  [이메일]', 40, 200);
    g.fillText('GitHub  [링크]', 40, 245);
  });
  const c = box(0.85, 0.02, 0.5, [
    mat('#ffffff'), mat('#ffffff'),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }),
    mat('#ffffff'), mat('#ffffff'), mat('#ffffff'),
  ]);
  card.add(c);
  card.position.set(-2.55, DESK_Y + 0.01, 0.75);
  card.rotation.y = 0.25;
}
clickable(card, '명함 · 연락처', {
  center: V(0, 0.011, 0), w: 0.85, h: 0.5,
  normal: V(0, 1, 0), up: V(0, 0, -1), src: 'list.html#contact',
});

// ---------- 카메라 자세 ----------
const look = V(0, 0.9, 0);
const halfTan = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

function homePose() {
  const a = innerWidth / innerHeight;
  const narrow = a < 1;
  const dir = narrow ? V(0, 0.88, 0.48) : V(0, 0.55, 0.84);
  // 책상 너비(8)가 화면 폭에 들어오도록 거리를 잡는다
  const dist = Math.max(10.2, 4.7 / (halfTan() * a));
  const center = V(0, 0.9, narrow ? 0.2 : 0);
  return { pos: center.clone().add(dir.normalize().multiplyScalar(dist)), look: center, up: V(0, 1, 0) };
}

// 표면의 세계 좌표 (가운데 · 바깥 방향 · 위쪽 · 오른쪽)
function surfaceFrame(s) {
  s.obj.updateMatrixWorld(true);
  const q = s.obj.getWorldQuaternion(new THREE.Quaternion());
  const n = s.normal.clone().applyQuaternion(q);
  const u = s.up.clone().applyQuaternion(q);
  return { c: s.obj.localToWorld(s.center.clone()), n, u, r: u.clone().cross(n) };
}
// 표면이 화면을 거의 채우도록 정면에서 바라보는 자세
function surfacePose(s) {
  const f = surfaceFrame(s);
  const dH = (s.h / 0.84 / 2) / halfTan();
  const dW = (s.w / 0.92 / 2) / (halfTan() * camera.aspect);
  const d = Math.max(dH, dW);
  return { pos: f.c.clone().add(f.n.clone().multiplyScalar(d)), look: f.c.clone(), up: f.u.clone() };
}
function setPose(p) {
  camera.position.copy(p.pos); camera.up.copy(p.up); look.copy(p.look); camera.lookAt(look);
}

// ---------- 확대 · 돌아오기 ----------
let state = 'home';      // home | flying | focus
let current = null;      // 확대한 표면
let tween = null;
const panel = document.getElementById('panel');
const frame = document.getElementById('frame');
const backBtn = document.getElementById('back');

function flyTo(pose, dur, done) {
  tween = {
    fromP: camera.position.clone(), fromL: look.clone(), fromU: camera.up.clone(),
    to: pose, t0: performance.now(), dur, done,
  };
}

function restObjects() {
  for (const o of clickables) { o.userData.lift = 0; o.position.y = o.userData.baseY; }
  phone.rotation.y = PHONE_ROT;
}

function openSurface(s) {
  if (state !== 'home') return;
  state = 'flying';
  setHover(null);
  restObjects();
  current = s;
  // 날아가는 동안 미리 불러 둔다
  if (s.src) frame.src = s.src;
  flyTo(surfacePose(s), 900, () => {
    state = 'focus';
    document.body.classList.add('zoomed');
    showPanel();
  });
}

function showPanel() {
  panel.classList.toggle('desktop', !!current.desktop && !current.appOpen);
  panel.classList.toggle('app', !current.desktop || !!current.appOpen);
  backBtn.textContent = current.appOpen ? '← 바탕화면' : '← 책상으로';
  placePanel();
  requestAnimationFrame(() => panel.classList.add('show'));
}

// 모니터 안에서 앱 열기
for (const b of document.querySelectorAll('#desktopIcons button')) {
  b.addEventListener('click', () => {
    if (state !== 'focus') return;
    frame.src = b.dataset.src;
    current.appOpen = true;
    showPanel();
  });
}

function back() {
  if (state !== 'focus') return;
  if (current.appOpen) {              // 모니터 앱 → 바탕화면
    current.appOpen = false;
    frame.src = 'about:blank';
    showPanel();
    return;
  }
  state = 'flying';
  panel.classList.remove('show', 'app', 'desktop');
  document.body.classList.remove('zoomed');
  frame.src = 'about:blank';
  current = null;
  if (location.hash) history.replaceState(null, '', location.pathname);
  flyTo(homePose(), 800, () => { state = 'home'; });
}
backBtn.addEventListener('click', back);
addEventListener('keydown', (e) => { if (e.key === 'Escape') back(); });

// 확대한 표면의 네 모서리를 화면 좌표로 바꿔 내용 상자를 맞춘다
function placePanel() {
  if (!current) return;
  const f = surfaceFrame(current);
  const pts = [[-1, 1], [1, 1], [1, -1], [-1, -1]].map(([sx, sy]) => f.c.clone()
    .add(f.r.clone().multiplyScalar(sx * current.w / 2))
    .add(f.u.clone().multiplyScalar(sy * current.h / 2))
    .project(camera))
    .map((p) => ({ x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }));
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const left = Math.min(...xs), topY = Math.min(...ys);
  Object.assign(panel.style, {
    left: left + 'px', top: topY + 'px',
    width: (Math.max(...xs) - left) + 'px', height: (Math.max(...ys) - topY) + 'px',
  });
}

// ---------- 마우스 올리기 · 누르기 ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const labelEl = document.getElementById('label');
let hovered = null;

function pick(e) {
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickables, true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && !clickables.includes(o)) o = o.parent;
  return o;
}
function setHover(obj, e) {
  hovered = obj;
  canvas.style.cursor = obj ? 'pointer' : 'default';
  if (obj && e) {
    labelEl.textContent = obj.userData.label;
    labelEl.style.display = 'block';
    labelEl.style.left = e.clientX + 'px';
    labelEl.style.top = e.clientY + 'px';
  } else {
    labelEl.style.display = 'none';
  }
}
canvas.addEventListener('pointermove', (e) => {
  if (state !== 'home') return;
  setHover(pick(e), e);
});
canvas.addEventListener('pointerleave', () => setHover(null));
canvas.addEventListener('click', (e) => {
  if (state !== 'home') return;
  const obj = pick(e);
  if (obj) openSurface(obj.userData.surface);
});

// ---------- 크기 · 그리기 ----------
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (state === 'home') setPose(homePose());
  else if (state === 'focus') { setPose(surfacePose(current)); placePanel(); }
}
addEventListener('resize', resize);

// 주소 끝이 #screen · #phone · #resume · #card 면 그 물건을 확대한 채로 시작
const startAt = { '#screen': monitor, '#phone': phone, '#resume': resume, '#card': card }[location.hash];
if (startAt) {
  state = 'focus';
  current = startAt.userData.surface;
  if (current.src) frame.src = current.src;
  document.body.classList.add('zoomed');
}
resize();
if (state === 'focus') showPanel();

const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
let nextRing = performance.now() + 2500;

renderer.setAnimationLoop((now) => {
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur);
    const e = ease(k);
    camera.position.lerpVectors(tween.fromP, tween.to.pos, e);
    look.lerpVectors(tween.fromL, tween.to.look, e);
    camera.up.lerpVectors(tween.fromU, tween.to.up, e).normalize();
    camera.lookAt(look);
    if (k === 1) { const done = tween.done; tween = null; done && done(); }
  }

  if (state === 'home') {
    // 올린 물건은 살짝 뜬다
    for (const o of clickables) {
      const target = o === hovered ? 0.08 : 0;
      o.userData.lift += (target - o.userData.lift) * 0.2;
      o.position.y = o.userData.baseY + o.userData.lift;
    }
    // 휴대폰은 가끔 진동한다
    const since = now - nextRing;
    if (since > 0 && since < 600) {
      phone.rotation.y = PHONE_ROT + Math.sin(since / 18) * 0.06;
    } else if (since >= 600) {
      phone.rotation.y = PHONE_ROT;
      nextRing = now + 3200;
    }
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
